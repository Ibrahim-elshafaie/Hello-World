<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Villa __PLOT__ 3D Tour</title>
<style>
  :root { --ink: #2b2723; --muted: #6f675e; --panel: rgba(255, 253, 249, 0.92); --line: #ddd5c8; --accent: #8a6a45; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e4dc; color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  .panel { position: fixed; top: 12px; left: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; max-width: calc(100vw - 24px); box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .panel h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  button, select { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .where { position: fixed; top: 12px; right: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; font-weight: 600; }
  .where small { display: block; font-weight: 400; color: var(--muted); }
  .help { position: fixed; bottom: 12px; left: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 10px; color: var(--muted); font-size: 13px; max-width: calc(100vw - 180px); }
  .pad { position: fixed; right: 16px; bottom: 16px; display: none; grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(2, 52px); gap: 6px; }
  .pad button { width: 52px; height: 52px; font-size: 20px; padding: 0; background: var(--panel); user-select: none;
    -webkit-user-select: none; touch-action: none; }
  .pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
  body.walk.touch .pad { display: grid; }
  .err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
</style>
</head>
<body class="walk">
<div class="panel">
  <h1>Villa __PLOT__, 3D tour</h1>
  <div class="row">
    <button id="mWalk" aria-pressed="true">Walk</button>
    <button id="mDoll" aria-pressed="false">Dollhouse</button>
    <span style="width:6px"></span>
    <button id="fGF" aria-pressed="true">Ground</button>
    <button id="fFF" aria-pressed="false">First</button>
  </div>
  <div class="row">
    <select id="goto" aria-label="Go to room"></select>
  </div>
</div>
<div class="where" id="where">Foyer<small>Ground floor</small></div>
<div class="help" id="help"></div>
<div class="pad">
  <button class="up" data-k="f" aria-label="Forward">&#9650;</button>
  <button class="left" data-k="l" aria-label="Step left">&#9664;</button>
  <button class="down" data-k="b" aria-label="Back">&#9660;</button>
  <button class="right" data-k="r" aria-label="Step right">&#9654;</button>
</div>
<div class="err" id="err">The 3D view could not start. Your browser needs WebGL turned on.</div>

<script>window.DESIGN = /*DESIGN*/null;</script>
<script>/*BUNDLE*/</script>
<script>
  setTimeout(() => { if (!window.__tourReady) document.getElementById('err').style.display = 'grid'; }, 8000);
</script>
</body>
</html>
